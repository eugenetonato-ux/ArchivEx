{% load static %}

<!-- ======================================================== -->
<!-- INTERACTIVE MOBILE ONBOARDING WALKTHROUGH TOUR           -->
<!-- ======================================================== -->
<div id="mobile-tour-overlay" class="fixed top-0 left-0 right-0 bottom-[60px] z-[9990] bg-slate-950/80 backdrop-blur-[2px] opacity-0 pointer-events-none transition-opacity duration-300 md:hidden"></div>

<!-- Pulsing spotlight frame on active menu item -->
<div id="mobile-tour-spotlight" class="fixed z-[9999] rounded-2xl border-2 border-amber-400 bg-amber-400/20 shadow-[0_0_25px_rgba(245,158,11,0.8)] pointer-events-none opacity-0 transition-all duration-300 ease-out md:hidden">
    <span class="absolute -top-1 -right-1 flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
    </span>
</div>

<!-- Floating Tutorial Card -->
<div id="mobile-tour-card" class="fixed left-4 right-4 bottom-24 z-[9999] bg-[#071A49]/95 backdrop-blur-2xl border border-white/20 text-white rounded-3xl p-5 shadow-[0_20px_50px_rgba(0,0,0,0.9)] transform translate-y-6 opacity-0 pointer-events-none transition-all duration-300 ease-out md:hidden">
    <!-- Header: Step badge, progress dots & close button -->
    <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
            <span id="tour-step-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider bg-blue-500/25 text-blue-300 border border-blue-400/30">
                Étape 1 / 5
            </span>
            <div id="tour-dots" class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
            </div>
        </div>
        <button type="button" onclick="stopMobileTour()" aria-label="Passer le tutoriel" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white flex items-center justify-center transition-colors">
            <i class="fa-solid fa-xmark text-xs" aria-hidden="true"></i>
        </button>
    </div>

    <!-- Content: Title, Description & Badge -->
    <div class="mb-4">
        <h3 id="tour-title" class="text-base font-black text-white flex items-center gap-2 tracking-tight">
            Accueil
        </h3>
        <p id="tour-desc" class="text-xs text-slate-200 mt-1.5 leading-relaxed">
            Votre point de départ : retrouvez vos raccourcis rapides, vos dernières consultations et les nouveautés de la plateforme.
        </p>
        <div id="tour-tag-wrap" class="mt-2.5">
            <span id="tour-tag" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg text-[10px] font-bold bg-blue-500/20 text-blue-300 border border-blue-400/30">
                <i class="fa-solid fa-compass text-[9px]"></i>
                <span id="tour-tag-text">Accès rapide</span>
            </span>
        </div>
    </div>

    <!-- Footer: Skip, Prev, Next buttons -->
    <div class="flex items-center justify-between pt-3 border-t border-white/10">
        <button type="button" onclick="stopMobileTour()" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">
            Ignorer
        </button>
        <div class="flex items-center gap-2">
            <button type="button" id="tour-btn-prev" onclick="prevMobileTourStep()" class="hidden px-3 py-1.5 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/20 text-white transition-all">
                Précédent
            </button>
            <button type="button" id="tour-btn-next" onclick="nextMobileTourStep()" class="px-4 py-2 rounded-xl text-xs font-black bg-[#2563EB] hover:bg-blue-600 text-white shadow-lg shadow-blue-600/40 transition-all flex items-center gap-1.5">
                <span id="tour-btn-next-text">Suivant</span>
                <i class="fa-solid fa-arrow-right text-[10px]" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    const TOUR_STORAGE_KEY = 'archivex_mobile_tour_v1_done';

    const TOUR_STEPS = [
        {
            targetId: 'dock-tab-home',
            title: 'Votre Accueil',
            desc: 'Votre point de départ au quotidien : retrouvez les raccourcis de navigation, vos annales récentes et les nouveautés.',
            tag: 'Navigation Principale',
            tagClass: 'text-blue-300 bg-blue-500/20 border-blue-400/30',
            icon: 'fa-compass'
        },
        {
            targetId: 'dock-tab-resources',
            title: 'Ressources Gratuites',
            desc: 'Accédez librement et sans abonnement à une sélection de sujets d\'examens et fiches pour vous entraîner gratuitement dès maintenant.',
            tag: '100% En Accès Libre',
            tagClass: 'text-emerald-300 bg-emerald-500/20 border-emerald-400/30',
            icon: 'fa-unlock'
        },
        {
            targetId: 'dock-tab-resources',
            title: 'Ressources Premium',
            desc: 'La bibliothèque complète : toutes les annales, l\'intégralité des corrigés détaillés rédigés pas à pas et les synthèses complètes grâce au Pass Semestre.',
            tag: 'Bibliothèque Intégrale · Pass Semestre',
            tagClass: 'text-amber-300 bg-amber-500/20 border-amber-400/30',
            icon: 'fa-crown'
        },
        {
            targetId: 'dock-tab-notifs',
            title: 'Notifications en direct',
            desc: 'Restez informé en temps réel dès qu\'une nouvelle épreuve ou un nouveau corrigé officiel est publié pour votre parcours.',
            tag: 'Alertes Nouvelles Épreuves',
            tagClass: 'text-purple-300 bg-purple-500/20 border-purple-400/30',
            icon: 'fa-bell'
        },
        {
            targetId: 'dock-tab-profile',
            title: 'Profil & Sécurité Appareils',
            desc: 'Gérez vos favoris, votre Pass Semestre et vérifiez vos 2 appareils autorisés protégés contre les partages et connexions non désirées.',
            tag: 'Espace Personnel & 2 Appareils max',
            tagClass: 'text-cyan-300 bg-cyan-500/20 border-cyan-400/30',
            icon: 'fa-shield-halved'
        }
    ];

    let currentStepIndex = 0;
    let isTourActive = false;

    function isMobile() {
        return window.innerWidth < 768;
    }

    function positionSpotlight(targetEl) {
        const spotlight = document.getElementById('mobile-tour-spotlight');
        if (!spotlight || !targetEl) return;
        const rect = targetEl.getBoundingClientRect();
        spotlight.style.top = (rect.top - 4) + 'px';
        spotlight.style.left = (rect.left - 4) + 'px';
        spotlight.style.width = (rect.width + 8) + 'px';
        spotlight.style.height = (rect.height + 8) + 'px';
        spotlight.style.opacity = '1';
    }

    function renderStep(index) {
        if (index < 0 || index >= TOUR_STEPS.length) return;
        currentStepIndex = index;
        const step = TOUR_STEPS[index];
        const targetEl = document.getElementById(step.targetId);

        // Position spotlight
        if (targetEl) {
            positionSpotlight(targetEl);
            // Highlight target dock tab
            document.querySelectorAll('.mobile-bottom-dock .dock-item').forEach(el => el.classList.remove('ring-2', 'ring-amber-400'));
            targetEl.classList.add('ring-2', 'ring-amber-400');
        }

        // Update badge
        const badge = document.getElementById('tour-step-badge');
        if (badge) badge.textContent = `Étape ${index + 1} / ${TOUR_STEPS.length}`;

        // Update dots
        const dotsContainer = document.getElementById('tour-dots');
        if (dotsContainer) {
            dotsContainer.innerHTML = TOUR_STEPS.map((_, i) => {
                const active = i === index;
                return `<span class="${active ? 'w-2.5 h-2 bg-blue-400' : 'w-1.5 h-1.5 bg-slate-600'} rounded-full transition-all"></span>`;
            }).join('');
        }

        // Title and description
        const titleEl = document.getElementById('tour-title');
        const descEl = document.getElementById('tour-desc');
        if (titleEl) titleEl.textContent = step.title;
        if (descEl) descEl.textContent = step.desc;

        // Tag
        const tag = document.getElementById('tour-tag');
        const tagText = document.getElementById('tour-tag-text');
        if (tag && tagText) {
            tag.className = `inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg text-[10px] font-bold border ${step.tagClass}`;
            tagText.textContent = step.tag;
            const iconEl = tag.querySelector('i');
            if (iconEl) iconEl.className = `fa-solid ${step.icon} text-[9px]`;
        }

        // Prev & Next buttons
        const prevBtn = document.getElementById('tour-btn-prev');
        const nextBtn = document.getElementById('tour-btn-next');
        const nextText = document.getElementById('tour-btn-next-text');

        if (prevBtn) {
            if (index > 0) prevBtn.classList.remove('hidden');
            else prevBtn.classList.add('hidden');
        }

        if (nextBtn && nextText) {
            if (index === TOUR_STEPS.length - 1) {
                nextText.textContent = "C'est parti !";
                nextBtn.className = "px-4 py-2 rounded-xl text-xs font-black bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/40 transition-all flex items-center gap-1.5";
            } else {
                nextText.textContent = "Suivant";
                nextBtn.className = "px-4 py-2 rounded-xl text-xs font-black bg-[#2563EB] hover:bg-blue-600 text-white shadow-lg shadow-blue-600/40 transition-all flex items-center gap-1.5";
            }
        }
    }

    window.nextMobileTourStep = function() {
        if (currentStepIndex < TOUR_STEPS.length - 1) {
            renderStep(currentStepIndex + 1);
        } else {
            stopMobileTour();
        }
    };

    window.prevMobileTourStep = function() {
        if (currentStepIndex > 0) {
            renderStep(currentStepIndex - 1);
        }
    };

    window.startMobileTour = function(force = false) {
        if (!isMobile()) return;
        if (!force && localStorage.getItem(TOUR_STORAGE_KEY) === 'done') return;

        const overlay = document.getElementById('mobile-tour-overlay');
        const card = document.getElementById('mobile-tour-card');
        const spotlight = document.getElementById('mobile-tour-spotlight');

        if (!overlay || !card) return;

        isTourActive = true;
        const dock = document.querySelector('.mobile-bottom-dock');
        if (dock) {
            dock.style.zIndex = '9998';
            dock.style.boxShadow = '0 -8px 30px rgba(0,0,0,0.6)';
        }

        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100');

        card.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-6');
        card.classList.add('opacity-100', 'translate-y-0');

        renderStep(0);
    };

    window.stopMobileTour = function() {
        const overlay = document.getElementById('mobile-tour-overlay');
        const card = document.getElementById('mobile-tour-card');
        const spotlight = document.getElementById('mobile-tour-spotlight');
        const dock = document.querySelector('.mobile-bottom-dock');

        if (dock) {
            dock.style.zIndex = '';
            dock.style.boxShadow = '';
        }

        if (overlay) {
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100');
        }
        if (card) {
            card.classList.add('opacity-0', 'pointer-events-none', 'translate-y-6');
            card.classList.remove('opacity-100', 'translate-y-0');
        }
        if (spotlight) {
            spotlight.style.opacity = '0';
        }
        document.querySelectorAll('.mobile-bottom-dock .dock-item').forEach(el => el.classList.remove('ring-2', 'ring-amber-400'));

        isTourActive = false;
        try {
            localStorage.setItem(TOUR_STORAGE_KEY, 'done');
        } catch(e) {}
    };

    // Auto-launch with smooth delay after login if not already seen
    window.addEventListener('DOMContentLoaded', function() {
        if (isMobile() && !localStorage.getItem(TOUR_STORAGE_KEY)) {
            setTimeout(function() {
                window.startMobileTour(false);
            }, 1200);
        }
    });

    // Reposition spotlight on orientation change or resize
    window.addEventListener('resize', function() {
        if (isTourActive && isMobile()) {
            const step = TOUR_STEPS[currentStepIndex];
            const targetEl = document.getElementById(step.targetId);
            if (targetEl) positionSpotlight(targetEl);
        }
    });
})();
</script>
