{% extends "base/base.html" %}
{% load static %}

{% block title %}Page introuvable — 404 | ArchivEx{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">

    <!-- BADGE ICON -->
    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-blue-50 border border-blue-100 text-[#2563EB] flex items-center justify-center mx-auto mb-6 shadow-sm">
        <i class="fa-solid fa-compass text-2xl sm:text-3xl"></i>
    </div>

    <!-- STATUS PILL -->
    <span class="inline-block px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 text-xs font-black uppercase tracking-wider mb-4">
        Page introuvable (404)
    </span>

    <!-- TITLE -->
    <h1 class="text-2xl sm:text-3xl font-black text-[#071A49] tracking-tight mb-3">
        Page introuvable
    </h1>

    <!-- DESCRIPTION -->
    <p class="text-xs sm:text-sm text-slate-600 font-medium leading-relaxed mb-6 max-w-md mx-auto">
        La page que vous recherchez n'existe pas ou n'est plus disponible.
    </p>

    <!-- SEARCH FORM -->
    <form method="get" action="{% url 'academics:global_search' %}" class="max-w-md mx-auto mb-8 flex items-center gap-2">
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" name="q" placeholder="Rechercher une épreuve, UE, résumé..." required class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-[#071A49] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#2563EB]">
        </div>
        <button type="submit" class="btn-primary text-xs px-4 py-2.5 font-bold flex-shrink-0">
            Rechercher
        </button>
    </form>

    <!-- ACTION BUTTONS -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <a href="{% url 'academics:home' %}" class="btn-primary text-xs px-6 py-3 font-bold w-full sm:w-auto inline-flex items-center justify-center space-x-2 shadow-sm">
            <i class="fa-solid fa-house text-xs"></i>
            <span>Retour à l'accueil</span>
        </a>
        <a href="{% url 'academics:filieres' %}" class="btn-secondary text-xs px-6 py-3 font-bold w-full sm:w-auto inline-flex items-center justify-center space-x-2">
            <i class="fa-solid fa-book text-xs"></i>
            <span>Explorer mes UE</span>
        </a>
    </div>

</div>
{% endblock %}
