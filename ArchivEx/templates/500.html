<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F7F9FC]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur — 500 | ArchivEx</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-slate-800 antialiased">

    <!-- HEADER -->
    <header class="w-full bg-white border-b border-slate-200 py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <span class="text-xl font-black tracking-tight text-[#071A49]">
                    Archiv<span class="text-[#2563EB]">Ex</span>
                </span>
            </a>
            <a href="/" class="text-xs font-bold text-[#2563EB] hover:underline flex items-center space-x-1">
                <i class="fa-solid fa-house text-xs"></i>
                <span>Accueil</span>
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="my-auto py-16 px-4 text-center">
        <div class="max-w-xl mx-auto">
            <!-- BADGE ICON -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-amber-50 border border-amber-200 text-amber-600 flex items-center justify-center mx-auto mb-6 shadow-sm">
                <i class="fa-solid fa-triangle-exclamation text-2xl sm:text-3xl"></i>
            </div>

            <!-- STATUS PILL -->
            <span class="inline-block px-3 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 text-xs font-black uppercase tracking-wider mb-4">
                Erreur serveur (500)
            </span>

            <!-- TITLE -->
            <h1 class="text-2xl sm:text-3xl font-black text-[#071A49] tracking-tight mb-3">
                Une erreur est survenue
            </h1>

            <!-- DESCRIPTION -->
            <p class="text-xs sm:text-sm text-slate-600 font-medium leading-relaxed mb-8 max-w-md mx-auto">
                Une erreur inattendue s'est produite. Notre équipe a été informée et travaille à résoudre le problème.
            </p>

            <!-- ACTION BUTTONS -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="/" class="px-6 py-3 rounded-2xl bg-[#2563EB] hover:bg-blue-700 text-white text-xs font-bold transition-all shadow-md w-full sm:w-auto inline-flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-house text-xs"></i>
                    <span>Retour à l'accueil</span>
                </a>
                <button onclick="window.location.reload()" class="px-6 py-3 rounded-2xl bg-white hover:bg-slate-50 text-[#071A49] text-xs font-bold transition-all border border-slate-200 w-full sm:w-auto inline-flex items-center justify-center space-x-2 shadow-sm">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                    <span>Réessayer</span>
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 font-medium">
        &copy; ArchivEx. Tous droits réservés.
    </footer>

</body>
</html>
